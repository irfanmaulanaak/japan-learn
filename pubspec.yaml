name: japan_learn
description: A cross-platform Japanese language learning app with SRS flashcards, goal tracking, and gamification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local database (SQLite)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Lightweight key-value store for settings/progress
  shared_preferences: ^2.3.2

  # Animations & fonts
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # On-device text-to-speech for kana / vocab / sentence audio
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fonts will be added once the kana UI lands.
  # Noto Sans JP files go in assets/fonts/ and are declared here.
